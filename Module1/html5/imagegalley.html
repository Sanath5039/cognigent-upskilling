<!DOCTYPE html>
<html>
<head>
    <style>
        .gallery {
            border: 2px solid black;
            width: 150px;
            height: 100px;
        }

        table {
            border-collapse: collapse;
        }

        td {
            padding: 10px;
        }
    </style>
</head>

<body>

<table border="1">
    <tr>
        <td>
            <img src="event1.jpg" alt="Music Event"
                 title="Music Event" class="gallery">
            <p>Music Festival</p>
        </td>

        <td>
            <img src="event2.jpg" alt="Food Event"
                 title="Food Event" class="gallery">
            <p>Food Carnival</p>
        </td>

        <td>
            <img src="event3.jpg" alt="Sports Event"
                 title="Sports Event" class="gallery">
            <p>Sports Day</p>
        </td>
    </tr>

    <tr>
        <td>
            <img src="event4.jpg" alt="Art Event"
                 title="Art Event" class="gallery">
            <p>Art Exhibition</p>
        </td>

        <td>
            <img src="event5.jpg" alt="Dance Event"
                 title="Dance Event" class="gallery">
            <p>Dance Show</p>
        </td>

        <td>
            <img src="event6.jpg" alt="Book Fair"
                 title="Book Fair" class="gallery">
            <p>Book Fair</p>
        </td>
    </tr>
</table>

</body>
</html>
