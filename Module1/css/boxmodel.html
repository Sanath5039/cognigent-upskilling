<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>

    <style>
        .eventCard {
            border: 2px solid black;
            padding: 20px;
            margin: 20px;
            background-color: lightyellow;
        }

        input:focus {
            outline: 3px solid blue;
        }

        .hidden {
            visibility: hidden;
        }

        .none {
            display: none;
        }
    </style>
</head>
<body>

    <div class="eventCard">
        Community Event Information
    </div>

    <input type="text" placeholder="Enter Name">

    <p class="hidden">Visibility Hidden Example</p>

    <p class="none">Display None Example</p>

</body>
</html>
