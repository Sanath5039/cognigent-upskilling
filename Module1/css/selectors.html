<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors Playground</title>

    <style>
        /* Universal Selector */
        * {
            margin: 0;
            padding: 0;
        }

        /* Element Selector */
        h2 {
            color: blue;
        }

        /* ID Selector */
        #mainHeader {
            background-color: orange;
            color: white;
            text-align: center;
            padding: 10px;
        }

        /* Class Selector */
        .eventCard {
            border: 2px solid black;
            padding: 10px;
            margin: 10px;
        }

        /* Grouping Selector */
        h3, p {
            font-family: Arial, sans-serif;
            color: green;
        }
    </style>
</head>

<body>

    <h1 id="mainHeader">Community Events</h1>

    <h2>Upcoming Events</h2>

    <div class="eventCard">
        Music Festival
    </div>

    <h3>Event Details</h3>

    <p>Join us this weekend.</p>

</body>
</html>
