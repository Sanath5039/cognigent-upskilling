<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Styling</title>

    <style>
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h1>Event Schedule</h1>

    <table>
        <tr>
            <th>Event</th>
            <th>Date</th>
            <th>Venue</th>
        </tr>

        <tr>
            <td>Music Festival</td>
            <td>10 July</td>
            <td>Community Hall</td>
        </tr>

        <tr>
            <td>Sports Meet</td>
            <td>15 July</td>
            <td>Sports Ground</td>
        </tr>

        <tr>
            <td>Food Fair</td>
            <td>20 July</td>
            <td>City Park</td>
        </tr>
    </table>

</body>
</html>
